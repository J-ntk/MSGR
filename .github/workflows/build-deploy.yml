# Rebuilds the website whenever content or code changes (including saves from the admin panel),
# commits the generated pages, refreshes the GitHub Pages preview (docs/) and — once the hosting
# secrets are set — uploads the site to Beget over FTP.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER    e.g. djdordje.beget.tech   (from the Beget panel → FTP)
#   FTP_USERNAME  the FTP login
#   FTP_PASSWORD  the FTP password
#   ADMIN_SETUP_KEY      one-time key to create the first admin account (remove after use)
#   ADMIN_GITHUB_TOKEN   fine-grained token so the admin panel can publish (Contents RW, Actions R)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   (optional) lead notifications in Telegram
# Variables (same page → Variables):
#   FTP_DIR       folder on the server, e.g. mystudygr.com/public_html/   (must end with /)
#   FTP_PROTOCOL  ftps (default) or ftp
#   MAIL_TO       where lead emails go (default mystudygr1@gmail.com)
# Until FTP_SERVER is set, the workflow only builds — nothing is uploaded.

name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "tools/**"
      - "assets/**"
      - "api/**"
      - "admin/**"
      - ".htaccess"
      - "robots.txt"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site (RU + UA + KZ)
        run: |
          export MSGR_DATE=$(git log -1 --format=%cs -- content tools)
          python tools/build_pages.py

      - name: Build GitHub Pages preview (docs/)
        run: |
          export MSGR_DATE=$(git log -1 --format=%cs -- content tools)
          rm -rf /tmp/gh && mkdir -p /tmp/gh && cp -r assets data /tmp/gh/
          MSGR_OUT=/tmp/gh MSGR_BASE=/MSGR python tools/build_pages.py
          sed -i -E 's#leadEndpoint: *"[^"]*"#leadEndpoint: ""#' /tmp/gh/assets/js/config.js
          touch /tmp/gh/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > /tmp/gh/robots.txt
          mkdir -p docs && rsync -a --delete /tmp/gh/ docs/

      - name: Check the build
        run: |
          test -f index.html && test -f ua/index.html && test -f kz/index.html
          test "$(find . -path ./docs -prune -o -name index.html -print | wc -l)" -ge 39
          grep -q 'hreflang="kk"' index.html

      - name: Commit generated pages
        run: |
          git config user.name "msgr-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Build site [skip ci]" && git push
          fi

      - name: Write server settings (api/config.php) from secrets
        if: env.HAS_FTP == 'true'
        env:
          ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_TO: ${{ vars.MAIL_TO || 'mystudygr1@gmail.com' }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          q = lambda v: "'" + (v or "").replace("\\", "\\\\").replace("'", "\\'") + "'"
          e = os.environ.get
          lines = [
              "<?php",
              "// Generated by GitHub Actions from repository secrets. Do not edit on the server.",
              "return [",
              f"    'telegram_bot_token' => {q(e('TELEGRAM_BOT_TOKEN'))},",
              f"    'telegram_chat_id'   => {q(e('TELEGRAM_CHAT_ID'))},",
              f"    'mail_to'            => {q(e('MAIL_TO'))},",
              "    'mail_from'          => 'no-reply@mystudygr.com',",
              "    'allowed_origins'    => ['https://mystudygr.com', 'https://www.mystudygr.com', 'https://new.mystudygr.com'],",
              f"    'admin_setup_key'    => {q(e('ADMIN_SETUP_KEY'))},",
              f"    'github_token'       => {q(e('ADMIN_GITHUB_TOKEN'))},",
              f"    'github_repo'        => {q(e('REPO'))},",
              "    'github_branch'      => 'main',",
              "];",
          ]
          open("api/config.php", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("api/config.php written (values hidden)")
          PY
          php -l api/config.php 2>/dev/null || true

      - name: Upload to hosting (Beget)
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            content/**
            docs/**
            README.md
            MIGRATION.md
            preview.html
            api/data/**
            **/__pycache__/**
            _to_delete/**
